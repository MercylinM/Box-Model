<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <title>Box-Model</title>
</head>
<body>
    <div class="container">
        <div class="image-container">
            <h1><b>Welcome to our <br> community!</b></h1>
            <img src="image/signup.png" alt="signip image">
        </div>

        <div class="form-continer">
            <form action="">
                <h2>Create Account</h2>
                <p id="signup">Sign up to your account below.</p>

                <fieldset>
                    <label for="first-name"> First Name
                        <br>
                        <input type="text" name="first-name" id="first-name" placeholder="|">
                    </label>

                    <label for="last-name"> Last Name
                        <br>
                        <input type="text" name="last-name" id="last-name" placeholder="|">
                    </label>
                </fieldset>

                <br>
                <label for="email">Email Address
                    <br>
                    <input type="email" name="email" id="email" placeholder="|">
                </label>

                <br>
                <label for="password">Password
                    <br>
                    <div class="toggle-icon">
                        <input type="password" name="confirm-password" id="confirm-password" placeholder="|">
                        <i class="fas fa-eye"></i>
                    </div>
                </label>

                <br>
                <label for="password">Confirm Password
                    <br>
                    <div class="toggle-icon">
                        <i class="fas fa-eye"></i>
                        <input type="password" name="confirm-password" id="confirm-password" placeholder="|">
                        
                    </div>
                    
                </label>

                <br>
                <button id="button">Create Account</button>

                <p id="signin">Already have an account? <a href="#">Sign In</a></p>

                <p class="lines"><b>or</b></p>

                <div class="icons">
                    <img src="image/search.png" alt="google">
                    <img src="image/facebook.png" alt="facebook">
                    <img src="image/apple-logo.png" alt="apple">
                </div>
            </form>
        </div>
    </div>
</body>
</html>
